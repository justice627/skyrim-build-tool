- {say: summoner, means: ["conjuration"], evidence: derived}
- {say: nuker, means: ["destruction"], evidence: derived}
- {say: sniper, means: ["archery sneak"], evidence: derived}
- {say: caster, means: ["destruction", "conjuration", "illusion", "alteration", "restoration"], evidence: derived}
