# Dragon shouts. `requires` names the game or DLC the shout comes from.
# Source: UESP Skyrim:Dragon Shouts and each shout's page, read through the wiki API on 2026-11-11
# (docs/sources/uesp-dragon-shouts.json). Effects describe the full three-word shout.
shouts:
- {id: animal-allegiance, name: Animal Allegiance, requires: vanilla, evidence: sourced, effect: "Nearby animals fight for you."}
- {id: aura-whisper, name: Aura Whisper, requires: vanilla, evidence: sourced, effect: "Reveals the life forces of nearby creatures and people."}
