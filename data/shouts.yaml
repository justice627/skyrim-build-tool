- {id: call-dragon, name: Call Dragon, requires: vanilla, evidence: sourced, effect: "Calls Odahviing to fight beside you."}
- {id: call-of-valor, name: Call of Valor, requires: vanilla, evidence: sourced, effect: "Summons a hero of Sovngarde to fight for you."}
- {id: clear-skies, name: Clear Skies, requires: vanilla, evidence: sourced, effect: "Clears fog and bad weather."}
- {id: disarm, name: Disarm, requires: vanilla, evidence: sourced, effect: "Knocks the weapon out of an enemy's hands."}
- {id: dismay, name: Dismay, requires: vanilla, evidence: sourced, effect: "Makes nearby enemies flee."}
- {id: dragonrend, name: Dragonrend, requires: vanilla, evidence: sourced, effect: "Forces a flying dragon to land."}
- {id: elemental-fury, name: Elemental Fury, requires: vanilla, evidence: sourced, effect: "Your weapon attacks get faster."}
