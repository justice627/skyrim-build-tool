- {id: bend-will, name: Bend Will, requires: DB, evidence: sourced, effect: "Makes people and animals do your bidding, and lets you tame and ride dragons."}
- {id: cyclone, name: Cyclone, requires: DB, evidence: sourced, effect: "Throws a damaging whirlwind that tosses enemies into the air."}
- {id: dragon-aspect, name: Dragon Aspect, requires: DB, evidence: sourced, effect: "Once a day: more armor, stronger power attacks and faster shout recharge."}
