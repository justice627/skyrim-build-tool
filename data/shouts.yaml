- {id: throw-voice, name: Throw Voice, requires: vanilla, evidence: sourced, effect: "Throws your voice to distract or lure enemies."}
- {id: unrelenting-force, name: Unrelenting Force, requires: vanilla, evidence: sourced, effect: "Staggers and knocks back whatever is in front of you."}
