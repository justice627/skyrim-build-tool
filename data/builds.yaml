# Build families and builds. Skill weights come from data/classes.json via each build's
# `classes` list; the first class in `classes` is the one whose weights the card shows.
# Variant classes must share identical weights within one variant (validate.py checks).
# Phase 1 fields on every build:
#   aliases   optional searchable alternate names
#   evidence  grade of the skill weights (sourced for every build read from UESP classes)
#   stone     {early, final (optional), evidence, ref (optional ledger row)}; ids from stones.yaml
#   shouts    {ids (2 to 4), evidence, ref (optional)}; ids from shouts.yaml
#   requires  optional list of extra requirements beyond the shouts (DG, HF, DB, CC, AE)
families:
- id: steel
  title: Shield and steel
  blurb: Heavy armor, a weapon you trust, and a lot of Health.
- id: north
  title: Northern raiders
  blurb: Light armor and big swings. Fast, loud, and short on finesse.
- id: ranks
  title: Guards and soldiers
  blurb: Generalist fighters drilled in every weapon and armor type.
- id: bow
  title: Bows and the wild
  blurb: Ranged first, with Sneak and Light Armor to keep distance.
- id: shadow
  title: Thieves and shadows
  blurb: Sneak, locks, pockets, and a blade for when it goes wrong.
- id: assassin
  title: Assassins and night casters
  blurb: Killing from stealth, with steel or with spells.
- id: battle
  title: Spellswords and battlemages
  blurb: A weapon in one hand, a spell in the other.
- id: robe
  title: Robed mages
  blurb: No armor skills. Magicka, distance, and the right school.
- id: holy
  title: Healers and holy orders
  blurb: Restoration first, with a weapon or a staff behind it.
- id: craft
  title: Crafters and merchants
  blurb: Make it, sell it, talk the price up. Fighting is optional.
- id: folk
  title: Common folk
  blurb: Challenge runs built from the lives of ordinary Skyrim.
- id: legend
  title: Legends
  blurb: Unique characters whose class files read like boss builds.
builds:
- id: housecarl
  family: steel
  name: Housecarl
  inspired_by: Generic warriors, mercenaries and the one-handed trainers
  aliases: [Warrior]
  evidence: sourced
  stone: {early: warrior, final: lord, evidence: derived}
  shouts: {ids: [unrelenting-force, elemental-fury, become-ethereal], evidence: derived}
  classes:
  - CombatWarrior1H
  - TrainerOneHandedExpert
  - TrainerOneHandedJourneyman
  variants:
  - label: 'One-handed master trainer: drops Archery, adds Sneak'
    classes:
    - TrainerOneHandedMaster
  - label: 'Sneak journeyman trainer: adds Sneak 3'
    classes:
    - TrainerSneakJourneyman
  - label: 'Speech journeyman trainer: adds Speech 3'
    classes:
    - TrainerSpeechcraftJourneyman
  - label: 'Lockpicking expert trainer: adds Lockpicking 4'
    classes:
    - TrainerLockpickExpert
  description: >-
    Sword, shield and the heaviest plate you can carry. Pull with the bow, then hold the doorway and trade
    blows. No Magicka at all, so healing comes from potions and food. The safest first character in the
    game.
- id: greatsword-mercenary
  family: steel
  name: Greatsword mercenary
  inspired_by: Two-handed warriors and trainers
  evidence: sourced
  stone: {early: warrior, final: lord, evidence: derived}
  shouts: {ids: [unrelenting-force, elemental-fury, marked-for-death], evidence: derived}
  classes:
  - CombatWarrior2H
  - TrainerTwoHandedExpert
  variants:
  - label: 'Two-handed master trainer: Two-Handed 4'
    classes:
    - TrainerTwoHandedMaster
  description: >-
    The Housecarl with the shield swapped for a greatsword or warhammer. Heavy armor soaks the hits while
    power attacks stagger. Block stays useful for bashing even without a shield. Stamina is your real
    resource, so keep a few potions for long fights.
- id: orc-stronghold-guard
  family: steel
  name: Orc stronghold guard
  inspired_by: Orc warriors guarding the strongholds
  evidence: sourced
  stone: {early: warrior, final: lord, evidence: derived}
  shouts: {ids: [unrelenting-force, disarm, marked-for-death], evidence: derived}
  classes:
  - GuardOrc1H
  variants:
  - label: Two-handed stronghold guard
    classes:
    - GuardOrc2H
  description: >-
    Heavy armor, one weapon, a bow for walls and gates. The NPC file feeds Magicka it never uses, so your
    plan moves those points into Stamina. Pairs naturally with the Orc race for Berserker Rage and a free
    Heavy Armor head start.
- id: shieldmaster
  family: steel
  name: Shieldmaster
  inspired_by: The Block master and expert trainers
  evidence: sourced
  stone: {early: warrior, final: lord, evidence: derived}
  shouts: {ids: [unrelenting-force, disarm, become-ethereal], evidence: derived}
  classes:
  - TrainerBlockMaster
  variants:
  - label: 'Block expert trainer: shield brawler with Speech and Pickpocket instead of armor'
    classes:
    - TrainerBlockExpert
  description: >-
    Block is the build. Shield up, perfect the timing, bash to stagger, then strike. Heavy armor and a
    one-hander do the rest. The NPC weights waste points on Magicka; the plan below puts them into Stamina
    for more bashes.
- id: barbarian
  family: north
  name: Barbarian
  inspired_by: Combat barbarians and the ancient Nord heroes in Sovngarde
  evidence: sourced
  stone: {early: warrior, final: lady, evidence: derived}
  shouts: {ids: [unrelenting-force, elemental-fury, whirlwind-sprint], evidence: derived}
  classes:
  - CombatBarbarian
  - MQAncientNord
  description: >-
    Light armor, a two-hander and a bow on the back. Move faster than the heavy builds, hit harder than
    the light ones, and live on Health. Plays like a Nord pure build with the Smithing and Speech cut
    out.
- id: bandit-raider
  family: north
  name: Bandit raider
  inspired_by: Bandit melee and Alik'r warriors (identical files)
  evidence: sourced
  stone: {early: warrior, final: lady, evidence: derived}
  shouts: {ids: [elemental-fury, whirlwind-sprint, dismay], evidence: derived}
  classes:
  - EncClassBanditMelee
  - EncClassAlikrMelee
  description: >-
    One-hander or two-hander, whichever you loot first, plus a shield when it fits. Light armor with a
    scrap of heavy. A scrappy, gear-agnostic fighter for a run where you take what you find on the road.
- id: hold-guard
  family: ranks
  name: Hold guard
  inspired_by: Imperial-aligned city guards
  evidence: sourced
  stone: {early: warrior, final: lord, evidence: derived}
  shouts: {ids: [unrelenting-force, disarm, call-of-valor], evidence: derived}
  classes:
  - GuardImperial
  variants:
  - label: 'Stormcloak guard: two-hander instead of one-hander, Magicka instead of Stamina'
    classes:
    - GuardSonsSkyrim
  description: >-
    Sword and shield, mixed armor, a bow for the walls, a little Sneak for night patrols. Health first.
    Good for a lawful roleplay where you take bounties and clear the hold's bandit camps.
- id: legionnaire
  family: ranks
  name: Legionnaire
  inspired_by: Imperial soldiers, Stormcloak soldiers and Civil War soldiers
  evidence: sourced
  stone: {early: warrior, final: steed, evidence: derived}
  shouts: {ids: [unrelenting-force, call-of-valor, marked-for-death], evidence: derived}
  classes:
  - SoldierImperialNotGuard
  variants:
  - label: 'Stormcloak soldier: same skills, Health and Magicka 1:1 instead of Stamina'
    classes:
    - SoldierSonsSkyrimNotGuard
  - label: 'Civil War soldier: lighter skill spread, Stamina 7'
    classes:
    - CWSoldierClass
  description: >-
    Every weapon and armor skill trained evenly. The Imperial file weights Stamina at 7, the highest in
    the game, so you sprint, power attack and bash all day. The Stormcloak file swaps that Stamina for
    unused Magicka; the plan below follows the Imperial version.
- id: jailor
  family: ranks
  name: Jailor
