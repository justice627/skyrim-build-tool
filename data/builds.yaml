  shouts: {ids: [disarm, unrelenting-force, throw-voice], evidence: derived}
  classes:
  - Jailor
  description: >-
    Sword, shield and light armor, plus the keys: Lockpicking, Pickpocket and Sneak. A watchman who can
    fight and also get into anywhere. Fits a Dawnguard-style patrol run or a corrupt-guard roleplay.
- id: ranger
  family: bow
