  name: Temple priest
  inspired_by: Priests and the Restoration and Enchanting trainers
  evidence: sourced
  stone: {early: mage, final: lover, evidence: derived}
  shouts: {ids: [kynes-peace, clear-skies, call-of-valor], evidence: derived}
  classes:
  - Priest
  variants:
  - label: 'Restoration journeyman trainer: Illusion 2 instead of Conjuration'
    classes:
    - TrainerRestorationJourneyman
  - label: 'Restoration master trainer: Restoration 4'
    classes:
    - TrainerRestorationMaster
  - label: 'Enchanting master trainer: Destruction 2 instead of Conjuration'
