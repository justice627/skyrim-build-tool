  play: "Imperial soldiers fight with a sword and shield and start in light Imperial armor; some later wear heavy Imperial armor. Stormcloaks wear light Stormcloak armor. So the kit for either side is a sword, a shield and light armor, with heavy armor as the Imperial upgrade. Keep Archery as a backup."
  stone: {early: warrior, final: steed, evidence: derived}
  shouts: {ids: [unrelenting-force, call-of-valor, marked-for-death], evidence: derived}
  examples: ["Legate Rikke", "General Tullius"]
  classes:
