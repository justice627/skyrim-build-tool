    examples: ["Chief Mauhulakh"]
    classes:
    - GuardOrc2H
  description: >-
    Heavy armor, one weapon, a bow for walls and gates. The NPC file feeds Magicka it never uses, so your
    plan moves those points into Stamina. Pairs naturally with the Orc race for Berserker Rage and a free
    Heavy Armor head start.
- id: shieldmaster
  family: steel
  name: Shieldmaster
  inspired_by: The Block master and expert trainers
  evidence: sourced
  stone: {early: warrior, final: lord, evidence: derived}
  shouts: {ids: [unrelenting-force, disarm, become-ethereal], evidence: derived}
  examples: ["Chief Larak"]
