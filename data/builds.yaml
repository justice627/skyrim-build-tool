# Build families and builds. Skill weights come from data/classes.json via each build's
# `classes` list; the first class in `classes` is the one whose weights the card shows.
# Variant classes must share identical weights within one variant (validate.py checks).
# Phase 1 fields on every build:
#   aliases   optional searchable alternate names
#   evidence  grade of the skill weights (sourced for every build read from UESP classes)
#   stone     {early, final (optional), evidence, ref (optional ledger row)}; ids from stones.yaml
#   shouts    {ids (2 to 4), evidence, ref (optional)}; ids from shouts.yaml
#   examples  optional, up to 3 named NPCs who use the build's classes (from data/uesp/uesp-npc-classes.json);
#             variants can have their own examples
#   lore      optional ledger C picks: {name, ref, evidence, changes, requires (optional), npc (optional,
#             must be in the UESP NPC data)}. Text is condensed from the ledger row, nothing added.
#   play      optional "In play" line: how to actually play the build where its data misleads (derived)
#   playstyles optional override of the filter tags (c, m, s, k); only where the skill rule misreads a build
#   requires  optional list of extra requirements beyond the shouts (DG, HF, DB, CC, AE)
families:
- id: steel
  title: Shield and steel
  blurb: Heavy armor, a weapon you trust, and a lot of Health.
- id: north
  title: Northern raiders
  blurb: Light armor and big swings. Fast, loud, and short on finesse.
- id: ranks
  title: Guards and soldiers
  blurb: Generalist fighters drilled in every weapon and armor type.
- id: bow
  title: Bows and the wild
  blurb: Ranged first, with Sneak and Light Armor to keep distance.
- id: shadow
  title: Thieves and shadows
  blurb: Sneak, locks, pockets, and a blade for when it goes wrong.
- id: assassin
  title: Assassins and night casters
  blurb: Killing from stealth, with steel or with spells.
- id: battle
  title: Spellswords and battlemages
  blurb: A weapon in one hand, a spell in the other.
- id: robe
  title: Robed mages
  blurb: No armor skills. Magicka, distance, and the right school.
- id: holy
  title: Healers and holy orders
  blurb: Restoration first, with a weapon or a staff behind it.
- id: craft
  title: Crafters and merchants
  blurb: Make it, sell it, talk the price up. Fighting is optional.
- id: folk
  title: Common folk
  blurb: Challenge runs built from the lives of ordinary Skyrim.
- id: legend
  title: Legends
  blurb: Unique characters whose class files read like boss builds.
- id: beyond
  title: Community builds
  blurb: Playstyles no NPC class can express. Their skill weights are set by hand from community sources, not read from the game.
builds:
- id: housecarl
  family: steel
  name: Warrior
  inspired_by: Generic warriors, mercenaries and the one-handed trainers
  aliases: [Housecarl, Fighters Guild]
  evidence: sourced
  stone: {early: warrior, final: lord, evidence: derived}
  shouts: {ids: [unrelenting-force, elemental-fury, become-ethereal], evidence: derived}
  examples: ["Lydia", "Hadvar", "Ulfric Stormcloak"]
  classes:
  - CombatWarrior1H
  - TrainerOneHandedExpert
  - TrainerOneHandedJourneyman
  variants:
  - label: 'One-handed master trainer: drops Archery, adds Sneak'
    examples: ["Chief Burguk"]
    classes:
    - TrainerOneHandedMaster
  - label: 'Sneak journeyman trainer: adds Sneak 3'
    examples: ["Khayla"]
    classes:
    - TrainerSneakJourneyman
  - label: 'Knight (Speech journeyman trainer): adds Speech 3'
    examples: ["Revyn Sadri"]
    classes:
    - TrainerSpeechcraftJourneyman
  - label: 'Lockpicking expert trainer: adds Lockpicking 4'
    examples: ["Ma'jhad"]
    classes:
    - TrainerLockpickExpert
  description: >-
    Sword, shield and the heaviest plate you can carry. Pull with the bow, then hold the doorway and trade
    blows. No Magicka at all, so healing comes from potions and food. The safest first character in the
    game.
  lore:
  - name: "Eternal Champion"
    ref: C40
    evidence: derived
    changes: "A sword-and-board lore label for the Warrior."
  - name: "Stormcrown"
    ref: C1
    evidence: derived
    mentions: ["Dragonbane", "Amulet of Talos"]
    changes: "Modeled on Talos. One-Handed 3, Block 3, Heavy Armor 3, Speech 2, Restoration 2. Storm Call and Call Dragon. Amulet of Talos and Dragonbane."
  - name: "Jarl of the Voice"
    ref: C2
    evidence: derived
    npc: "Ulfric Stormcloak"
    changes: "Modeled on Ulfric. One-Handed 3, Heavy Armor 2, Block 2, Speech 2. Unrelenting Force."
  - name: "Knight of the Nine"
    ref: G75
    evidence: partly-sourced
    changes: "A knight of the Nine Divines in a heavy cuirass, with a sword or mace and a shield."
  - name: "Erabenimsun warrior"
    ref: G39
    evidence: partly-sourced
    changes: "A Dunmer Ashlander warrior in heavy armor. Swaps the sword for a war axe, after the tribe's glass war axe."
  - name: "House Redoran"
    ref: G59
    signature: ["Bonemold Armor"]  # Lore:House Redoran
    evidence: partly-sourced
    changes: "A Dunmer house warrior who wears bonemold armor. Fights with a broad sword and parries with the blade."
- id: greatsword-mercenary
  family: steel
  name: Greatsword mercenary
  inspired_by: Two-handed warriors and trainers
  evidence: sourced
  stone: {early: warrior, final: lord, evidence: derived}
  shouts: {ids: [unrelenting-force, elemental-fury, marked-for-death], evidence: derived}
  examples: ["Mjoll the Lioness", "Torbjorn Shatter-Shield"]
  classes:
  - CombatWarrior2H
  - TrainerTwoHandedExpert
  variants:
  - label: 'Two-handed master trainer: Two-Handed 4'
    examples: ["Vilkas"]
    classes:
    - TrainerTwoHandedMaster
  description: >-
    The Warrior with the shield swapped for a greatsword or warhammer. Heavy armor soaks the hits while
    power attacks stagger. Block stays useful for bashing even without a shield. Stamina is your real
    resource, so keep a few potions for long fights.
  lore:
  - name: "Redoran Swordmaster"
    mentions: ["Ebony Greatsword", "Redoran Watchman's Helmet"]
    ref: C26
    evidence: partly-sourced
    requires: [DB]
    changes: "Lord Stone. Two-Handed, Block, Alteration and Restoration. Redoran Watchman's Helmet, an Ebony Greatsword, and Slow Time."
  - name: "Kodlak"
    mentions: ["Skyforge Steel Greatsword"]
    ref: C27
    signature: ["Wolf Armor"]  # Skyrim:Specialty Gear, Companions Equipment
    evidence: derived
    npc: "Kodlak Whitemane"
    changes: "A Skyforge Steel Greatsword. A werewolf who wants to be cured, so his soul goes to Sovngarde."
  - name: "Ysgramor"
    mentions: ["Shield of Ysgramor"]
    ref: C27
    evidence: derived
    changes: "Wuuthrad, which cannot be used with the Shield of Ysgramor. Battle Fury, if you have Dragonborn."
  - name: "Blackwood Company"
    ref: G15
    evidence: partly-sourced
    changes: "A Khajiit or Argonian mercenary in heavy armor who takes any contract. The page names no weapon type."
- id: orc-stronghold-guard
