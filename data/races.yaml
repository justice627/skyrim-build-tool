  - One-Handed
  attributes:
  - 2
  - 1
  - 1
  power: 'Voice of the Emperor: calm'
  note: 'Battlemage paladin: sword and shield in heavy armor, healing and Destruction in reserve.'
- race: Khajiit
  signature: Sneak
