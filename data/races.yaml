# Pure race builds: only the skills a race starts with a bonus in (+10 signature, +5 others).
# Skill bonuses and powers: UESP Skyrim:Races, read through the wiki API on 2026-11-11 (docs/sources/uesp-races.wiki).
# `attributes` is a recommended Health:Magicka:Stamina ratio, not game data (evidence: derived).
races:
- race: Altmer
  signature: Illusion
  plus5:
  - Alteration
  - Conjuration
  - Destruction
  - Enchanting
  - Restoration
  attributes:
  - 1
  - 2
  - 0
  power: 'Highborn: fast Magicka regen'
  note: >-
    Pure mage. Starts with +50 Magicka, so Health is the weak point; no armor skill at all, so lean on
    Alteration's armor spells.
- race: Argonian
  signature: Lockpicking
  plus5:
  - Alteration
  - Light Armor
  - Pickpocket
  - Restoration
  - Sneak
  attributes:
  - 1
  - 1
  - 1
  power: 'Histskin: fast Health regen'
  note: >-
    No offensive skill. Damage has to come from Restoration's anti-undead spells, followers, or Alteration
    Paralyze. The hardest pure build.
- race: Bosmer
  signature: Archery
  plus5:
  - Alchemy
  - Light Armor
  - Lockpicking
  - Pickpocket
  - Sneak
  attributes:
  - 2
  - 0
  - 1
  power: Command Animal
  note: Classic stealth archer. Poisons from Alchemy carry the damage curve.
- race: Breton
  signature: Conjuration
  plus5:
  - Alchemy
  - Alteration
  - Illusion
  - Restoration
  - Speech
  attributes:
  - 1
  - 2
  - 0
  power: 'Dragonskin: absorb spells'
  note: >-
    Summoner with no direct damage school. Atronachs and thralls do the fighting; Illusion keeps you out
    of it.
- race: Dunmer
  signature: Destruction
  plus5:
  - Alchemy
  - Alteration
  - Illusion
  - Light Armor
  - Sneak
  attributes:
  - 1
  - 2
  - 0
  power: 'Ancestor''s Wrath: fire cloak'
  note: >-
    Stealth caster. Sneak plus Illusion Quiet Casting makes Destruction sneak-attacks possible.
