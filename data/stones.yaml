# The 13 standing stones. Only one stone blessing is active at a time; the Aetherial Crown
# (Dawnguard) allows a second. The Warrior, Mage and Thief stones are the Guardian Stones near Riverwood.
# Source: UESP Skyrim:Standing Stone, read through the wiki API on 2026-11-11 (docs/sources/uesp-standing-stone.wiki).
stones:
- id: warrior
  name: Warrior Stone
  effect: Combat skills, including Smithing but not Archery, improve 20% faster.
  requires: vanilla
  evidence: sourced
- id: mage
  name: Mage Stone
  effect: Magic skills, including Enchanting, improve 20% faster.
  requires: vanilla
  evidence: sourced
- id: thief
  name: Thief Stone
  effect: Stealth skills, including Archery and Alchemy, improve 20% faster.
  requires: vanilla
  evidence: sourced
- id: lord
  name: Lord Stone
  effect: Adds 50 armor rating and 25% magic resistance.
  requires: vanilla
  evidence: sourced
- id: lady
  name: Lady Stone
  effect: Health and Stamina regenerate 25% faster.
  requires: vanilla
  evidence: sourced
- id: steed
  name: Steed Stone
  effect: Adds 100 carry weight. Worn armor weighs nothing and does not slow you.
  requires: vanilla
  evidence: sourced
- id: apprentice
  name: Apprentice Stone
  effect: Magicka regenerates twice as fast, but you take twice the damage from magic.
  requires: vanilla
  evidence: sourced
- id: atronach
  name: Atronach Stone
  effect: Adds 50 Magicka and absorbs 50% of spells, but Magicka regenerates 50% slower.
  requires: vanilla
  evidence: sourced
- id: ritual
  name: Ritual Stone
  effect: Once a day, reanimates nearby corpses to fight for you.
  requires: vanilla
  evidence: sourced
- id: lover
  name: Lover Stone
  effect: All skills improve 15% faster.
  requires: vanilla
  evidence: sourced
- id: serpent
  name: Serpent Stone
  effect: Once a day, a ranged poison that paralyzes a target for 5 seconds and damages it.
  requires: vanilla
  evidence: sourced
- id: shadow
  name: Shadow Stone
  effect: Once a day, makes you invisible for 60 seconds.
  requires: vanilla
  evidence: sourced
- id: tower
  name: Tower Stone
  effect: Once a day, opens any lock up to Expert.
  requires: vanilla
  evidence: sourced
