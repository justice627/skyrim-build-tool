# Gear kits (ledger D): item bundles that fit a build. `items` are UESP page titles, checked by
# fetch_terms.py. Requirement tags (CC and the Creation's name, or DLC) are not typed here: build.py
# reads them from each item's UESP page header. `fits` lists build ids, from the ledger's pairing.
# Evidence grades the pairing; that the items exist is sourced.
kits:
- id: spell-knight
  name: Spell Knight
  ref: D1
  items: ["Spell Knight Armor"]
  fits: [spellsword]
  evidence: partly-sourced
  note: "Iron, Steel and Ebony heavy armor sets. The Ebony set adds one-handed damage, cheaper Destruction and more Magicka."
- id: necromantic-grimoire
  name: Necromantic Grimoire
  ref: D2
  items: ["Necromantic Grimoire", "Bone Colossus"]
  mentions: ["Necromancy", "Dark Souls"]
  fits: [conjurer, preserver]
  evidence: partly-sourced
  note: "Skeleton minions, a Bone Colossus and new robes. Its strongest enchantment needs the Necromancy and Dark Souls perks."
- id: arcane-archer
  name: Arcane Archer
  ref: D3
  items: ["Arcane Archer Pack"]
  fits: [battle-archer, witchhunter]
  evidence: partly-sourced
  note: "Elemental, bone and soul-stealing arrows, plus a Bound Quiver."
- id: tribunal-ordinator
  name: Tribunal Ordinator
